<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>비즈니스 영어 30일</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💼</text></svg>">
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">

  <!-- 로그인 화면 -->
  <section class="view active" id="view-login">
    <div class="login-wrap">
      <div class="login-emoji">💼</div>
      <h1>비즈니스 영어 30일</h1>
      <p class="login-sub">데일리 30분, 8/24 ~ 9/30<br/>회화·리스닝 중심 실전 트레이닝</p>
      <button class="btn btn-google" id="google-login-btn">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.9 32.7 29.4 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.1 5.5 29.3 3.5 24 3.5 12.7 3.5 3.5 12.7 3.5 24S12.7 44.5 24 44.5 44.5 35.3 44.5 24c0-1.2-.1-2.4-.9-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.1 5.5 29.3 3.5 24 3.5c-7.7 0-14.4 4.4-17.7 11.2z"/><path fill="#4CAF50" d="M24 44.5c5.2 0 9.9-2 13.4-5.2l-6.2-5.2c-2 1.4-4.6 2.3-7.2 2.3-5.3 0-9.8-3.3-11.4-8l-6.5 5C9.5 40 16.2 44.5 24 44.5z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.7 2.1-2 3.9-3.7 5.2l6.2 5.2C41.5 35.6 44.5 30.3 44.5 24c0-1.2-.1-2.4-.9-3.5z"/></svg>
        Google로 로그인
      </button>
      <button class="btn btn-outline login-skip" id="skip-login-btn">일단 로그인 없이 시작 (이 기기에만 저장)</button>
      <p class="login-note">Google로 로그인하면 폰·PC에서 학습 진행상황이 자동으로 동기화돼요.</p>
    </div>
  </section>

  <!-- 앱 셸 -->
  <div id="app-shell" style="display:none">
    <header class="topbar">
      <h1 id="topbar-title">💼 비즈니스 영어</h1>
      <div class="streak" id="streak-badge">🔥 0일</div>
    </header>

    <main>
      <!-- 홈 -->
      <section class="view" id="view-home">
        <div class="today-card">
          <div class="label" id="home-daylabel">Day 1</div>
          <div class="en" id="home-title-en">-</div>
          <div class="ko" id="home-title-ko">-</div>
          <div class="actions">
            <button class="btn btn-white btn-block" id="home-start-btn">▶ 오늘 학습 시작 (약 30분)</button>
          </div>
        </div>

        <div class="stat-row">
          <div class="stat-box">
            <div class="num" id="stat-done">0</div>
            <div class="lbl">완료한 Day</div>
          </div>
          <div class="stat-box">
            <div class="num" id="stat-streak">0</div>
            <div class="lbl">연속 학습일</div>
          </div>
          <div class="stat-box">
            <div class="num" id="stat-dday">-</div>
            <div class="lbl">9/30까지 D-day</div>
          </div>
        </div>

        <div class="section-title">주차별 진행률</div>
        <div class="week-grid" id="home-week-grid"></div>

        <button class="btn btn-outline btn-block" id="home-view-all-btn">📅 전체 커리큘럼 보기</button>
      </section>

      <!-- 커리큘럼 목록 -->
      <section class="view" id="view-days">
        <div class="section-title">전체 커리큘럼 (30일)</div>
        <div id="days-list"></div>
      </section>

      <!-- 설정 -->
      <section class="view" id="view-settings">
        <div class="section-title">계정</div>
        <div class="card" id="settings-account">
          <div id="settings-account-info">로그인 안 함 (이 기기 전용 저장)</div>
          <button class="btn btn-outline btn-block" id="settings-login-btn" style="display:none;">Google로 로그인하고 동기화 시작</button>
          <button class="btn btn-outline btn-block" id="settings-logout-btn" style="display:none;">로그아웃</button>
        </div>

        <div class="section-title">음성 설정</div>
        <div class="card">
          <label class="field-label">대화 A(1번 화자) 음성</label>
          <select id="voice-select"></select>
          <button class="btn btn-outline" id="voice-test-btn" style="margin-top:10px;">🔊 A 음성 테스트</button>

          <label class="field-label" style="margin-top:18px;">대화 B(2번 화자) 음성</label>
          <select id="voice-select-b"></select>
          <button class="btn btn-outline" id="voice-test-btn-b" style="margin-top:10px;">🔊 B 음성 테스트</button>
          <div style="font-size:11.5px;color:var(--text-soft);margin-top:8px;">기기에 음성이 여러 개 있으면 A/B를 다른 목소리로 자동 배정해요. 헷갈리면 여기서 직접 다르게 골라주세요.</div>

          <label class="field-label" style="margin-top:18px;">말하기 속도: <span id="rate-value">0.9</span></label>
          <input type="range" id="rate-range" min="0.6" max="1.2" step="0.05" value="0.9" style="width:100%;" />
        </div>

        <div class="section-title">학습 기록 초기화</div>
        <div class="card">
          <button class="btn btn-outline btn-block" id="reset-progress-btn" style="color:var(--danger);border-color:var(--danger-bg);">전체 진행상황 초기화</button>
        </div>
      </section>

      <!-- 레슨 화면 -->
      <section class="view" id="view-lesson">
        <div class="lesson-topbar">
          <button class="back-btn" id="lesson-back">←</button>
          <div class="lesson-steps" id="lesson-steps"></div>
        </div>
        <div id="lesson-content"></div>
      </section>
    </main>

    <nav class="bottom-nav" id="bottom-nav">
      <button data-view="home" class="active"><span class="nav-icon">🏠</span>홈</button>
      <button data-view="days"><span class="nav-icon">📅</span>커리큘럼</button>
      <button data-view="settings"><span class="nav-icon">⚙️</span>설정</button>
    </nav>
  </div>

</div>

<script src="data/week1.js"></script>
<script src="data/week2.js"></script>
<script src="data/week3.js"></script>
<script src="data/week4.js"></script>
<script src="data/week5.js"></script>
<script src="data/curriculum.js"></script>
<script src="firebase-config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
